[package]
name = "moavcs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "moavcs"
path = "src/main.rs"

[dependencies]
moavcs-core = { path = "../moavcs-core" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui_extras = "0.29.1"
rfd = "0.16"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[build-dependencies]
embed-resource = "3"

