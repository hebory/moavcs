[workspace]
members = ["crates/moavcs-core"]
resolver = "2"

[workspace.package]
version = "0.14.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Globalization", "Win32_Security", "Win32_System_SystemServices"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"


