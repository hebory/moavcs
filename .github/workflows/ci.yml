name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Prepare verified Lore CLI for integration tests
        shell: pwsh
        run: |
          $lore = ./scripts/get-test-lore.ps1
          "MOAVCS_LORE_EXE=$lore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run verification
        shell: pwsh
        run: ./scripts/verify.ps1 -Configuration Release
      - name: Ensure Inno Setup Compiler is available
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Inno Setup." }
          }
      - name: Build installer and portable archive
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Smoke test per-user install and uninstall
        shell: pwsh
        run: |
          $version = ./scripts/version.ps1
          ./scripts/test-installer.ps1 -InstallerPath "artifacts/release/moavcs-$version-win-x64-setup.exe"
      - name: Smoke test native Explorer overlay installer
        shell: pwsh
        run: ./scripts/test-overlay-installer.ps1
