name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Validate release tag
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tags must use stable semantic versions such as v0.1.0."
          }
          "APP_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Ensure Inno Setup Compiler is available
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Chocolatey could not install Inno Setup." }
          }
      - name: Prepare verified Lore CLI for integration tests
        run: |
          $lore = ./scripts/get-test-lore.ps1
          "MOAVCS_LORE_EXE=$lore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify release source
        run: ./scripts/verify.ps1 -Configuration Release
      - name: Build installer, portable archive, and checksums
        run: ./scripts/package.ps1 -Version $env:APP_VERSION
      - name: Smoke test per-user install and uninstall
        run: ./scripts/test-installer.ps1 -InstallerPath "artifacts/release/moavcs-$env:APP_VERSION-win-x64-setup.exe"
      - name: Smoke test native Explorer overlay installer
        run: ./scripts/test-overlay-installer.ps1
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/release/moavcs-$env:APP_VERSION-win-x64-setup.exe",
            "artifacts/release/moavcs-$env:APP_VERSION-win-x64-portable.zip",
            "artifacts/release/SHA256SUMS.txt"
          )
          gh release create $env:GITHUB_REF_NAME @assets --title "moavcs $env:GITHUB_REF_NAME" --notes "Windows x64 설치 파일과 런타임 포함 포터블 ZIP입니다. SHA256SUMS.txt에서 해시를 확인할 수 있습니다." --generate-notes --verify-tag --latest
